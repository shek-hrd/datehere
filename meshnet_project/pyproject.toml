[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meshnet"
version = "0.2.0"
description = "MeshNet: resilient P2P mesh with invites, encrypted UDP, routing, blockchain chat, live session beacon, CLI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pynacl>=1.5",
  "websockets>=12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "build>=1.0.0"]

[project.scripts]
meshctl = "meshnet.cli:main"

[tool.setuptools]
packages = ["meshnet"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
